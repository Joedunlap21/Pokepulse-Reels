name: Voice Samples

# Makes a short clip of every voice so you can pick one.
# Run it, then download "voice-samples" from the run page.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install requests pillow cloudinary edge-tts
      - run: python reel_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: voice-samples
          path: voice_samples/
          retention-days: 7
