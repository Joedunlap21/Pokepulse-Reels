name: Make AI Backgrounds

# Run by hand: Actions -> Make AI Backgrounds -> Run workflow.
# Makes new background videos with Google Veo (needs billing on for the GEMINI_API_KEY project;
# Veo 3.1 Lite is about $0.40 per 8-second clip) and saves them into the clip library.
on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many clips to make (about $0.40 each)"
        default: "4"
      prompt:
        description: "Optional: your own idea (no Pokemon names - describe it instead)"
        default: ""
      model:
        description: "Veo model"
        type: choice
        default: veo-3.1-lite-generate-preview
        options:
          - veo-3.1-lite-generate-preview
          - veo-3.1-fast-generate-preview
          - veo-3.1-generate-preview

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate clips
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_CLIP_COUNT: ${{ inputs.count }}
          AI_CLIP_PROMPT: ${{ inputs.prompt }}
          VEO_MODEL: ${{ inputs.model }}
        run: |
          pip install requests
          python ai_backgrounds.py

      - name: Save to repo
        run: |
          git config user.name "pokepulse-ai-backgrounds"
          git config user.email "actions@users.noreply.github.com"
          git add clips/
          git diff --cached --quiet && exit 0
          git commit -m "AI backgrounds $(date -u +%F)"
          git pull --rebase -q origin main
          git push
