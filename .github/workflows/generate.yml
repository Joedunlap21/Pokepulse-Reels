name: PokePulse Auto Reels

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic to post (leave blank = automatic by time of day)'
        required: false
        default: ''
        type: choice
        options: ['', 'news', 'drops', 'sales', 'bulk', 'chase']
      voice_mode:
        description: 'Voiceover: auto = the 9:30am & 5:30pm posts, on = always, off = music only'
        required: false
        default: 'auto'
        type: choice
        options: ['auto', 'on', 'off']
      voice:
        description: 'Voice (run "Voice Samples" to hear them all)'
        required: false
        default: ''
        type: choice
        options: ['', 'random', 'en-US-AndrewMultilingualNeural', 'en-US-BrianMultilingualNeural', 'en-US-AvaMultilingualNeural', 'en-US-EmmaMultilingualNeural', 'en-US-ChristopherNeural', 'en-US-SteffanNeural', 'en-GB-RyanNeural', 'en-AU-WilliamNeural']
      dry_run:
        description: 'Test only - make the video but DO NOT post it (download it from the run page)'
        required: false
        default: false
        type: boolean
  schedule:
    # Times are UTC. 9:30am, 12:30pm, 5:30pm, 9:30pm Eastern (daylight time)
    - cron: '30 13,16,21,1 * * *'

permissions:
  contents: read

jobs:
  render_and_post_reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          pip install requests pillow cloudinary edge-tts numpy opencv-python-headless

      - name: Generate & Publish Reel
        env:
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID_2: ${{ secrets.IG_USER_ID_2 }}
          IG_TOKEN_2: ${{ secrets.IG_TOKEN_2 }}
          POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          REEL_TOPIC: ${{ github.event.inputs.topic }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          REEL_VOICE_MODE: ${{ github.event.inputs.voice_mode }}
          # To change the voice for scheduled posts, set a repo VARIABLE named REEL_VOICE
          REEL_VOICE: ${{ github.event.inputs.voice || vars.REEL_VOICE }}
          # Drop-alert format for the drops topic. Set a repo VARIABLE DROPS_STYLE=classic to switch it off
          DROPS_STYLE: ${{ vars.DROPS_STYLE }}
        run: python main.py

      - name: Save video for download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokepulse-reel
          path: pokepulse_reel.mp4
          if-no-files-found: ignore
          retention-days: 7
