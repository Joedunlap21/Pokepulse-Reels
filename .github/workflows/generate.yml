name: PokePulse Auto Reels

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic to post (leave blank = automatic by time of day)'
        required: false
        default: ''
        type: choice
        options: ['', 'news', 'drops', 'sales', 'bulk']
  schedule:
    # Times are UTC. 9:30am, 12:30pm, 5:30pm, 9:30pm Eastern (daylight time)
    - cron: '30 13,16,21,1 * * *'

jobs:
  render_and_post_reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          pip install requests pillow cloudinary

      - name: Generate & Publish Reel
        env:
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }}
          REEL_TOPIC: ${{ github.event.inputs.topic }}
        run: python main.py
