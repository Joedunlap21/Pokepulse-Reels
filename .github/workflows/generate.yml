name: PokePulse Auto Reels

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic to post (leave blank = automatic by time of day)'
        required: false
        default: ''
        type: choice
        options: ['', 'news', 'drops', 'sales', 'bulk']
      dry_run:
        description: 'Test only - make the video but DO NOT post it (download it from the run page)'
        required: false
        default: false
        type: boolean
  schedule:
    # Times are UTC. 9:30am, 12:30pm, 5:30pm, 9:30pm Eastern (daylight time)
    - cron: '30 13,16,21,1 * * *'

permissions:
  contents: read

jobs:
  render_and_post_reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          pip install requests pillow cloudinary edge-tts

      - name: Generate & Publish Reel
        env:
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID_2: ${{ secrets.IG_USER_ID_2 }}
          IG_TOKEN_2: ${{ secrets.IG_TOKEN_2 }}
          POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REEL_TOPIC: ${{ github.event.inputs.topic }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python main.py

      - name: Save video for download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokepulse-reel
          path: pokepulse_reel.mp4
          if-no-files-found: ignore
          retention-days: 7
