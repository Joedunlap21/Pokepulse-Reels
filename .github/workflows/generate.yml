name: Generate Story Cover

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run cover generator
        run: |
          python main.py

      - name: Save output image
        uses: actions/upload-artifact@v4
        with:
          name: viral-story-cover
          path: test_cover.png
